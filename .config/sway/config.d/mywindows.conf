# swaymsg -t get_tree | less

# general
default_border none
default_floating_border none
for_window [app_id=".*"] border pixel 2

for_window [window_role="pop-up"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [instance="Download" class="Firefox"] floating enable
for_window [instance="Download" class="Opera"] floating enable
for_window [class="URxvt"] border pixel 2
for_window [app_id="foot"] border pixel 2
for_window [class="Keeper Password Manager"] floating enable
#for_window [class="XTerm"] floating enable

for_window [class="TeamViewer"] floating enable
for_window [class="Claws-mail" window_role="compose"] floating enable
for_window [class="Claws-mail" window_role="message_search"] floating enable
# for_window [class="Krusader" id="0x1e00127"] floating enable
for_window [class="ffplay"] floating enable
for_window [class="Enpass"] floating enable
for_window [class="Keepassx2"] floating enable
for_window [app_id="org.keepassxc.KeePassXC"] floating enable
for_window [class="Pinentry"] floating enable
for_window [class="Putty"] floating enable
for_window [class="Gnome-calculator"] floating enable
for_window [class="gnome-calculator"] floating enable
# for_window [class="VirtualBox" id="0x2a012e5"] floating enable
for_window [class="Wireshark"] floating enable
for_window [class="Gajim"] floating enable
for_window [class="org.remmina.Remmina"] floating enable
for_window [class="Seafile Client"] floating enable
for_window [class="Pavucontrol"] floating enable
for_window [class="Blueman-manager"] floating enable
for_window [app_id="blueman-manager"] floating enable
for_window [class="zoom"] floating enable
for_window [class="Virt-manager"] floating enable
for_window [class="Com.cisco.anyconnect.gui"] floating enable

# dia
for_window [window_role="toolbox_window"] floating enable
# skype
# for_window [class="Skype"] floating enable, border none, sticky enable
for_window [class="Skype"] floating enable, border none

# spark
#for_window [class="sun-awt-X11-XFramePeer"] floating enable, border none, sticky enable
for_window [class="com-install4j-runtime-launcher-UnixLauncher"] floating enable, border none, sticky enable

# Tickr RSS
for_window [class="Tickr"] floating enable, border none, focus_on_window_activation none, no_focus

# VirtualBox
# xor_window [id=0x100000d] floating enable
for_window [class="Conky"] floating enable, border none, sticky enable

for_window [class="mpv"] floating enable, border none

# QtCreator
for_window [title="QtConsole"] border 1pixel, floating enable, workspace 4
#, fullscreen toggle
#for_window [title="QtConsole"] border 1pixel, floating enable, workspace 4
#for_window [class="proba"] border 1pixel, floating enable, workspace 4

# ProxMox
for_window [app_id="microsoft-edge-beta" title="^(QEMU|VM).*"] floating enable

for_window [app_id="wdisplays"] floating enable

# Thunar file manager copy window
for_window [title="File Operation Progress"] floating enable
for_window [class="teams-for-linux" title="Sign in to your account"] floating enable
for_window [app_id="nm-openconnect-auth-dialog"] floating enable
for_window [class="VirtualBoxVM"] floating enable
for_window [title="Dbeaver"] floating enable
# for_window [class="VirtualBox"] floating enable
